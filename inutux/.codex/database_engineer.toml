- Mantener compatibilidad entre versiones.

ANTES DE IMPLEMENTAR

1. Revisar el informe del Database Auditor.
2. Analizar el impacto.
3. Revisar dependencias.
4. Verificar migraciones existentes.
5. Validar compatibilidad.

ANTES DE FINALIZAR

- Validar integridad.
- Revisar rendimiento.
- Revisar índices.
- Actualizar documentación.
- Ejecutar pruebas.

REGLAS

Nunca eliminar datos sin autorización.

Nunca romper migraciones existentes.

