{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}UNITUX | Compras Seguras{% endblock %}</title>
    
    <!-- Fuentes Outfit y Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <!-- Tailwind CSS CDN (Para desarrollo rápido sin build step) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            bg: '#05070B',
                            card: '#191c21',
                            dark: '#0b0e13',
                            cyan: '#00F0FF',
                            emerald: '#05E777',
                            text: '#e1e2ea',
                            muted: '#849495'
                        }
                    },
                    fontFamily: {
                        outfit: ['Outfit', 'sans-serif'],
                        jakarta: ['Plus Jakarta Sans', 'sans-serif']
                    },
                    boxShadow: {
                        'glow-cyan': '0 0 24px -4px rgba(0, 240, 255, 0.25)',
                        'glow-emerald': '0 0 20px -4px rgba(5, 231, 119, 0.3)'
                    }
                }
            }
        }
    </script>

    <style>
        body { 
            background-color: #05070B; 
            color: #e1e2ea; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
        }
        h1, h2, h3, .font-outfit { font-family: 'Outfit', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Animaciones base */
        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fade-in 0.3s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    {% block content %}{% endblock %}
    
    <!-- Scripts globales si fueran necesarios -->
    {% block extra_js %}{% endblock %}
</body>
</html>
